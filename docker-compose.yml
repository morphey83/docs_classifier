services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docs}
      POSTGRES_DB: ${POSTGRES_DB:-docs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docs} -d ${POSTGRES_DB:-docs}"]
      interval: 5s
      timeout: 5s
      retries: 15

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - docdata:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["saq", "app.worker.settings_dict"]
    volumes:
      - docdata:/data
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.bot"]
    volumes:
      - docdata:/data          # derived cache + (local backend) blobs
    depends_on:
      db:
        condition: service_healthy
    profiles: ["bot"]           # `docker compose --profile bot up` once BOT_TOKEN is set

  # --- optional local S3 (`docker compose --profile s3 up -d`) --------------
  # Set in .env:  STORAGE_BLOBS=s3  S3_ENDPOINT=http://minio:9000
  #               S3_ACCESS_KEY=…  S3_SECRET_KEY=…  S3_BUCKET=docsclassifier
  # Moving to a remote host later = point S3_ENDPOINT there and drop this.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-docsclassifier}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-minio}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 15
    profiles: ["s3"]

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-docsclassifier} $${S3_SECRET_KEY:-change-me-minio} &&
      mc mb --ignore-existing local/$${S3_BUCKET:-docsclassifier} &&
      mc anonymous set none local/$${S3_BUCKET:-docsclassifier} &&
      echo 'bucket ready'"
    profiles: ["s3"]

volumes:
  pgdata:
  docdata:
  miniodata:
