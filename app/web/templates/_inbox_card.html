{% if not doc %}
<div data-empty="1" class="text-center py-3">
  <div class="alert alert-success d-inline-block">Очередь пуста 🎉</div>
  <div><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Закрыть</button></div>
</div>
{% else %}
<div data-doc="{{ doc.id }}">
  <p class="text-secondary mb-2">
    <span class="badge bg-blue-lt">{{ domain.name }}</span> ·
    {{ doc.mime }} · {{ doc.size_bytes|humansize }} · {{ doc.doc_date|shortdate }} ·
    <a href="/documents/{{ doc.id }}" target="_blank">открыть ↗</a>
  </p>

  {% if is_image %}
  <img src="/documents/{{ doc.id }}/thumb" alt="превью" class="inbox-preview">
  {% endif %}

  <form hx-post="/inbox/{{ doc.id }}/done" hx-target="#tagcard">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="domain_id" value="{{ picked }}">

    <div class="mb-3">
      <label class="form-label">Название</label>
      <input class="form-control" name="title" value="{{ doc.title }}" autocomplete="off" maxlength="500" required>
    </div>

    <div class="mb-2">
      <label class="form-label">Теги</label>
      <input class="form-control" name="tags" id="tagfield" autocomplete="off" autofocus
             value="{{ cur_tags|join(', ') }}" placeholder="через запятую">
    </div>

    {% if freq %}
    <div class="freq-tags">
      <span class="freq-label">частые:</span>
      {% for name in freq %}
      <button type="button" class="freq" data-tag="{{ name }}">{{ name }}</button>
      {% endfor %}
    </div>
    {% endif %}

    <div class="tag-actions">
      <button type="button" hx-post="/inbox/{{ doc.id }}/defer" hx-target="#tagcard"
              hx-include="closest form" class="btn btn-outline-secondary">Отложить</button>
      <button type="submit" class="btn btn-primary">Готово, дальше →</button>
    </div>
  </form>
</div>

<script>
(function () {
  var field = document.getElementById('tagfield');
  var chips = Array.prototype.slice.call(document.querySelectorAll('.freq-tags .freq'));
  function cur() {
    return field.value.split(',').map(function (s) { return s.trim().toLowerCase(); })
      .filter(Boolean);
  }
  function sync() {
    var have = cur();
    chips.forEach(function (c) {
      c.disabled = have.indexOf(c.dataset.tag.toLowerCase()) !== -1;
    });
  }
  chips.forEach(function (c) {
    c.addEventListener('click', function () {
      if (cur().indexOf(c.dataset.tag.toLowerCase()) === -1) {
        var v = field.value.trim().replace(/,\s*$/, '');
        field.value = (v ? v + ', ' : '') + c.dataset.tag;
      }
      sync();
      field.focus();
    });
  });
  field.addEventListener('input', sync);
  sync();
})();
</script>
{% endif %}
