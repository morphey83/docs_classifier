{% import "_macros.html" as m %}
{% if not doc %}
<div data-empty="1" class="text-center py-3">
  <div class="alert alert-success d-inline-block">Очередь пуста 🎉</div>
  <div><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Закрыть</button></div>
</div>
{% else %}
<div data-doc="{{ doc.id }}">
  <p class="text-secondary mb-2">
    <span class="badge bg-blue-lt">{{ domain.name }}</span> ·
    {{ doc.mime }} · {{ doc.size_bytes|humansize }} · {{ doc.doc_date|shortdate }}
  </p>

  {% if is_image %}
  <img src="/documents/{{ doc.id }}/thumb" alt="превью" class="inbox-preview">
  {% endif %}

  <form hx-post="/inbox/{{ doc.id }}/done" hx-target="#tagcard">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="domain_id" value="{{ picked }}">
    <input type="hidden" name="skip" value="{{ skip }}">

    <div class="mb-3">
      <label class="form-label">Название</label>
      <input class="form-control" name="title" value="{{ doc.title }}" autocomplete="off" maxlength="500" required>
    </div>

    <div class="mb-2">
      <label class="form-label">Теги</label>
      {{ m.tagfield('tags', cur_tags|join(', '), freq) }}
    </div>

    <div class="tag-actions">
      <button type="button" hx-post="/inbox/{{ doc.id }}/skip" hx-target="#tagcard"
              hx-include="closest form" class="btn btn-outline-secondary">Пропустить</button>
      <button type="submit" class="btn btn-primary">Готово, дальше →</button>
    </div>
  </form>
</div>
{% endif %}
