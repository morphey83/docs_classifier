{% if not doc %}
<div data-empty="1">
  <p class="flash ok">Очередь пуста 🎉</p>
  <button onclick="closeTag()">Закрыть</button>
</div>
{% else %}
<div data-doc="{{ doc.id }}">
  <p class="muted" style="margin-bottom:.5rem">
    [{{ domain.name }}] · {{ doc.mime }} · {{ doc.size_bytes|humansize }} ·
    {{ doc.doc_date|shortdate }} ·
    <a href="/documents/{{ doc.id }}" target="_blank">открыть ↗</a>
  </p>

  {% if is_image %}
  <img src="/documents/{{ doc.id }}/thumb" alt="превью" class="inbox-preview">
  {% endif %}

  <form hx-post="/inbox/{{ doc.id }}/done" hx-target="#tagcard">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="domain_id" value="{{ picked }}">

    <label>Название
      <input name="title" value="{{ doc.title }}" autocomplete="off" maxlength="500" required>
    </label>

    <label>Теги
      <input name="tags" id="tagfield" autocomplete="off" autofocus
             value="{{ cur_tags|join(', ') }}" placeholder="через запятую">
    </label>

    {% if freq %}
    <div class="freq-tags">
      <span class="freq-label muted">частые:</span>
      {% for name in freq %}
      <button type="button" class="freq" data-tag="{{ name }}">{{ name }}</button>
      {% endfor %}
    </div>
    {% endif %}

    <div class="tag-actions">
      <button type="button" hx-post="/inbox/{{ doc.id }}/defer" hx-target="#tagcard"
              hx-include="closest form" class="secondary outline">Отложить</button>
      <button type="submit">Готово, дальше →</button>
    </div>
  </form>
</div>

<script>
(function () {
  var field = document.getElementById('tagfield');
  var chips = Array.prototype.slice.call(document.querySelectorAll('.freq-tags .freq'));
  function cur() {
    return field.value.split(',').map(function (s) { return s.trim().toLowerCase(); })
      .filter(Boolean);
  }
  function sync() {
    var have = cur();
    chips.forEach(function (c) {
      var used = have.indexOf(c.dataset.tag.toLowerCase()) !== -1;
      c.classList.toggle('used', used);
      c.disabled = used;
    });
  }
  chips.forEach(function (c) {
    c.addEventListener('click', function () {
      if (cur().indexOf(c.dataset.tag.toLowerCase()) === -1) {
        var v = field.value.trim().replace(/,\s*$/, '');
        field.value = (v ? v + ', ' : '') + c.dataset.tag;
      }
      sync();
      field.focus();
    });
  });
  field.addEventListener('input', sync);
  sync();
})();
</script>
{% endif %}
