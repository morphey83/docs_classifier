{% import "_icons.html" as ic %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem('dc-theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-bs-theme', t);
    })();
  </script>
  <title>Подтвердите email — DocsClassifier</title>
  <link rel="stylesheet" href="/static/tabler.min.css">
  <style>.icon{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}</style>
</head>
<body class="d-flex flex-column">
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <a href="/search" class="navbar-brand navbar-brand-autodark">DocsClassifier</a>
    </div>
    <div class="card card-md">
      <div class="card-body text-center">
        <div class="mb-3 text-primary">{{ ic.icon('mail') }}</div>
        <h2 class="h2 mb-3">Проверьте почту</h2>
        <p class="text-secondary">
          Мы отправили письмо со ссылкой для подтверждения на
          <strong>{{ email }}</strong>. Перейдите по ссылке, чтобы завершить регистрацию —
          она действует 48&nbsp;часов.
        </p>
        <form method="post" action="/verify/resend" class="mt-3">
          <input type="hidden" name="csrf_token" value="{{ csrf }}">
          <input type="hidden" name="login" value="{{ email }}">
          <button type="submit" class="btn btn-outline-secondary w-100">Отправить письмо ещё раз</button>
        </form>
      </div>
    </div>
    <div class="text-center text-secondary mt-3">
      <a href="/login">Вернуться ко входу</a>
    </div>
  </div>
</div>
</body>
</html>
