{% import "_icons.html" as ic %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem('dc-theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-bs-theme', t);
    })();
  </script>
  <title>Вход — DocsClassifier</title>
  <link rel="stylesheet" href="/static/tabler.min.css">
  <style>.icon{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}</style>
</head>
<body class="d-flex flex-column">
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <a href="/search" class="navbar-brand navbar-brand-autodark">DocsClassifier</a>
    </div>
    <div class="card card-md">
      <div class="card-body">
        <h2 class="h2 text-center mb-4">Вход</h2>
        {% if verified %}<div class="alert alert-success">Адрес подтверждён — теперь можно войти.</div>{% endif %}
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        {% if resend_login %}
        <form method="post" action="/verify/resend" class="mb-3">
          <input type="hidden" name="csrf_token" value="{{ csrf }}">
          <input type="hidden" name="login" value="{{ resend_login }}">
          <button type="submit" class="btn btn-outline-secondary w-100">Отправить письмо ещё раз</button>
        </form>
        {% endif %}
        <form method="post" action="/login" autocomplete="off">
          <input type="hidden" name="csrf_token" value="{{ csrf }}">
          <input type="hidden" name="next" value="{{ next or '' }}">
          <div class="mb-3">
            <label class="form-label">Логин или email</label>
            <div class="input-icon">
              <span class="input-icon-addon">{{ ic.icon('user') }}</span>
              <input class="form-control" name="login" required autofocus value="{{ login or '' }}"
                     placeholder="логин или email">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Пароль</label>
            <div class="input-icon">
              <span class="input-icon-addon">{{ ic.icon('lock') }}</span>
              <input class="form-control" name="password" type="password" required placeholder="пароль">
            </div>
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100">Войти</button>
          </div>
        </form>
      </div>
    </div>
    <div class="text-center text-secondary mt-3">
      Нет аккаунта?
      <a href="/register{% if next %}?next={{ next|urlencode }}{% endif %}">Зарегистрироваться</a>
    </div>
  </div>
</div>
</body>
</html>
