<!doctype html>
<html lang="ru" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — DocsClassifier</title>
  <link rel="stylesheet" href="/static/tabler.min.css">
</head>
<body class="d-flex flex-column">
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <a href="/search" class="navbar-brand navbar-brand-autodark">DocsClassifier</a>
    </div>
    <div class="card card-md">
      <div class="card-body">
        <h2 class="h2 text-center mb-4">Вход</h2>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" action="/login" autocomplete="off">
          <input type="hidden" name="csrf_token" value="{{ csrf }}">
          <input type="hidden" name="next" value="{{ next or '' }}">
          <div class="mb-3">
            <label class="form-label">Логин или email</label>
            <input class="form-control" name="login" required autofocus value="{{ login or '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input class="form-control" name="password" type="password" required>
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100">Войти</button>
          </div>
        </form>
      </div>
    </div>
    <div class="text-center text-secondary mt-3">
      Нет аккаунта?
      <a href="/register{% if next %}?next={{ next|urlencode }}{% endif %}">Зарегистрироваться</a>
    </div>
  </div>
</div>
</body>
</html>
