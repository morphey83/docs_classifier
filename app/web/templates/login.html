{% extends "base.html" %}
{% block title %}Вход — DocsClassifier{% endblock %}
{% block content %}
<article style="max-width: 24rem; margin-inline: auto;">
  <h1>Вход</h1>
  {% if error %}<p class="flash err">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <label>Логин или email
      <input name="login" required autofocus value="{{ login or '' }}">
    </label>
    <label>Пароль
      <input name="password" type="password" required>
    </label>
    <button type="submit">Войти</button>
  </form>
  <p class="muted">Нет аккаунта? <a href="/register{% if next %}?next={{ next|urlencode }}{% endif %}">Зарегистрироваться</a></p>
</article>
{% endblock %}
