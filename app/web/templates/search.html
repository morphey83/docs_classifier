{% extends "base.html" %}
{% block title %}Поиск документов{% endblock %}
{% block content %}
<h1>Поиск документов</h1>

<div class="grid-search">
  <form id="filters" method="get" action="/search"
        hx-get="/search" hx-target="#results" hx-push-url="true"
        hx-trigger="submit, input changed delay:400ms, change delay:200ms">
    <input type="hidden" name="view" value="{{ view }}">
    <input type="hidden" name="sort" value="{{ f.sort }}">
    <input type="hidden" name="dir" value="{{ f.dir }}">

    <label>Домен
      <select name="domain_id">
        <option value="" {{ 'selected' if not f.domain_id }}>все доступные</option>
        {% for d in domains %}
        <option value="{{ d.id }}" {{ 'selected' if f.domain_id == d.id|string }}>{{ d.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Запрос
      <input type="text" name="q" value="{{ f.q }}" placeholder="слова из названия / текста">
    </label>
    <label>Теги (через запятую)
      <input name="tags" value="{{ f.tags }}" placeholder="договор, 2024">
    </label>
    <label>Тип (расширение)
      <select name="type">
        <option value="" {{ 'selected' if not f.type }}>любой</option>
        {% if f.type and f.type not in ext_options %}
        <option value="{{ f.type }}" selected>{{ f.type }}</option>
        {% endif %}
        {% for ext in ext_options %}
        <option value="{{ ext }}" {{ 'selected' if f.type == ext }}>{{ ext }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Статус
      <select name="status">
        <option value="" {{ 'selected' if not f.status }}>любой</option>
        <option value="inbox" {{ 'selected' if f.status == 'inbox' }}>в очереди</option>
        <option value="tagged" {{ 'selected' if f.status == 'tagged' }}>размечен</option>
      </select>
    </label>
    <fieldset>
      <label><input type="checkbox" name="has_ocr" value="yes" {{ 'checked' if f.has_ocr == 'yes' }}> распознан (OCR)</label>
      <label><input type="checkbox" name="has_index" value="yes" {{ 'checked' if f.has_index == 'yes' }}> проиндексирован</label>
    </fieldset>
    <button type="submit">Искать</button>
  </form>

  <div id="results">
    {% include "_results.html" %}
  </div>
</div>
{% endblock %}
