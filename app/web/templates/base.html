<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DocsClassifier{% endblock %}</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <style>
    body { padding-block: 0; }
    main.container { padding-block: 1.5rem 4rem; }
    nav.topbar { border-bottom: 1px solid var(--pico-muted-border-color);
      position: relative; z-index: 20; }
    nav.topbar .container { padding-block: .4rem; }
    nav.topbar > .container > ul { display: flex; align-items: center; margin: 0;
      padding: 0; flex-wrap: wrap; gap: .1rem .25rem; }
    nav.topbar > .container > ul > li { list-style: none; padding: 0 .45rem; }
    nav.topbar li.push { margin-left: auto; }   /* pin the profile to the right */
    .muted { color: var(--pico-muted-color); }
    .tag { display:inline-block; padding:.05rem .5rem; margin:.1rem; border-radius:1rem;
           background: var(--pico-secondary-background); font-size:.8rem; white-space:nowrap; }
    .facet a { text-decoration:none; }
    .grid-search { display:grid; grid-template-columns: 15rem 1fr; gap: 1.5rem; align-items:start; }
    @media (max-width: 800px) { .grid-search { grid-template-columns: 1fr; } }
    .result { padding:.6rem 0; border-bottom:1px solid var(--pico-muted-border-color); }
    .result h4 { margin-bottom:.2rem; }
    .inline-form { display:inline; }
    table.meta td:first-child { width: 12rem; color: var(--pico-muted-color); }
    .flash { padding:.6rem 1rem; border-radius:var(--pico-border-radius); margin-bottom:1rem; }
    .flash.ok  { background:#dcfce7; color:#166534; }
    .flash.err { background:#fee2e2; color:#991b1b; }
    nav.domain-tabs { display:flex; gap:.25rem; flex-wrap:wrap; margin:.5rem 0 1.5rem;
      border-bottom:1px solid var(--pico-muted-border-color); }
    nav.domain-tabs a { padding:.4rem .8rem; text-decoration:none; border-bottom:2px solid transparent; }
    nav.domain-tabs a[aria-current] { border-bottom-color: var(--pico-primary); font-weight:600; }
    .results-head { display:flex; gap:.5rem; align-items:baseline; flex-wrap:wrap;
      margin:.4rem 0; font-size:.85rem; }
    .results-head .spacer { flex:1; }
    .results-head a { text-decoration:none; padding:.1rem .35rem; border-radius:.3rem; }
    .results-head a.active { background: var(--pico-primary); color:#fff; }
    nav.pager { display:flex; gap:.5rem; margin-top:1rem; }
    th a { text-decoration:none; white-space:nowrap; }
    .profile-menu { margin-bottom:0; }
    .profile-menu > summary { padding:.3rem .6rem; }
    .profile-menu > summary::after { display:none; }        /* hide pico's caret */
    /* open the menu leftward so it never leaves the screen at the right edge */
    .profile-menu[open] > ul { left:auto; right:0; min-width:13rem; z-index:30; }
    .profile-menu > ul li { padding:.15rem .25rem; }
    .profile-menu > ul form { margin:0; }
    .profile-menu > ul form button { width:100%; }
    .icon-actions { display:flex; gap:.15rem; }
    .icon-actions a, .icon-actions button {
      text-decoration:none; padding:.15rem .35rem; border:0; background:none;
      font-size:1rem; cursor:pointer; line-height:1; color:inherit; border-radius:.25rem; }
    .icon-actions a:hover, .icon-actions button:hover { background: var(--pico-secondary-background); }
    .icon-actions .danger:hover { background:#fee2e2; }
    .freq-tags { display:flex; flex-wrap:wrap; gap:.35rem; margin:.2rem 0 1rem; }
    .freq-tags .freq {
      padding:.15rem .7rem; border-radius:1rem; font-size:.82rem; line-height:1.4;
      cursor:pointer; transition:none;
      background:#fff; border:1px solid var(--pico-primary);
      color:var(--pico-primary); -webkit-text-fill-color:var(--pico-primary); }
    .freq-tags .freq:hover:not(:disabled) {
      background:var(--pico-primary); color:#fff; -webkit-text-fill-color:#fff; }
    .freq-tags .freq:disabled {   /* tag already picked — "spent" */
      background:#f1f3f5; border:1px dashed #ced4da;
      color:#868e96; -webkit-text-fill-color:#868e96;
      text-decoration:line-through; cursor:default; opacity:1; }
    #tagdlg article { margin:0; }
  </style>
  <script src="/static/htmx.min.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
  <nav class="topbar">
    <div class="container">
      <ul>
        <li><strong><a href="/search" class="contrast">DocsClassifier</a></strong></li>
        {% if user %}
        <li><a href="/search">Поиск</a></li>
        <li><a href="/inbox">Очередь на сортировку</a></li>
        <li><a href="/upload">Загрузка</a></li>
        <li><a href="/">Домены</a></li>
        <li class="push">
          <details class="dropdown profile-menu">
            <summary role="button" class="secondary outline" aria-label="Профиль">👤</summary>
            <ul>
              <li><a href="/profile">{{ user.username }} — профиль</a></li>
              <li>
                <form method="post" action="/logout">
                  <input type="hidden" name="csrf_token" value="{{ csrf }}">
                  <button class="secondary" type="submit">Выйти</button>
                </form>
              </li>
            </ul>
          </details>
        </li>
        {% else %}
        <li class="push">
          <a href="/login" role="button" class="secondary outline" aria-label="Войти">👤</a>
        </li>
        {% endif %}
      </ul>
    </div>
  </nav>
  <main class="container">
    {% if flash %}<div class="flash {{ flash_kind or 'ok' }}">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
