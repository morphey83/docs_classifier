{% extends "base.html" %}
{% block title %}Поиск по всем доменам{% endblock %}
{% block content %}
<h1>Поиск по всем доменам</h1>

<div class="grid-search">
  <form id="filters" method="get" action="/search"
        hx-get="/search" hx-target="#results" hx-push-url="true"
        hx-trigger="submit, input changed delay:400ms, change delay:200ms">
    <label>Запрос
      <input type="search" name="q" value="{{ f.q }}" placeholder="слова из названия / текста">
    </label>
    <label>Теги (через запятую)
      <input name="tags" value="{{ f.tags }}" placeholder="договор, 2024">
    </label>
    <label>Тип <input name="type" value="{{ f.type }}" placeholder="pdf"></label>
    <label>Статус
      <select name="status">
        <option value="" {{ 'selected' if not f.status }}>любой</option>
        <option value="inbox" {{ 'selected' if f.status == 'inbox' }}>инбокс</option>
        <option value="tagged" {{ 'selected' if f.status == 'tagged' }}>размечен</option>
        <option value="archived" {{ 'selected' if f.status == 'archived' }}>архив</option>
      </select>
    </label>
    <label>Сортировка
      <select name="sort">
        {% for key, label in sorts.items() %}
        <option value="{{ key }}" {{ 'selected' if f.sort == key }}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <fieldset>
      <label><input type="checkbox" name="has_ocr" value="yes" {{ 'checked' if f.has_ocr == 'yes' }}> распознан</label>
      <label><input type="checkbox" name="has_index" value="yes" {{ 'checked' if f.has_index == 'yes' }}> проиндексирован</label>
    </fieldset>
    <button type="submit">Искать</button>
  </form>

  <div id="results">
    {% include "_results.html" %}
  </div>
</div>
{% endblock %}
