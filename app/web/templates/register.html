{% extends "base.html" %}
{% block title %}Регистрация — DocsClassifier{% endblock %}
{% block content %}
<article style="max-width: 24rem; margin-inline: auto;">
  <h1>Регистрация</h1>
  {% if error %}<p class="flash err">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <label>Логин
      <input name="username" required autofocus value="{{ username or '' }}"
             pattern="[a-zA-Z0-9_.\-]+" minlength="3" maxlength="64">
    </label>
    <label>Email
      <input name="email" type="email" required value="{{ email or '' }}">
    </label>
    <label>Пароль
      <input name="password" type="password" required minlength="8">
    </label>
    <button type="submit">Создать аккаунт</button>
  </form>
  <p class="muted">Уже есть аккаунт? <a href="/login{% if next %}?next={{ next|urlencode }}{% endif %}">Войти</a></p>
</article>
{% endblock %}
