{% extends "base.html" %}
{% block title %}Очередь на сортировку{% endblock %}
{% block content %}
<hgroup>
  <h1>Очередь на сортировку</h1>
  <p class="muted">неразмеченные документы из всех ваших доменов</p>
</hgroup>

<form method="get" action="/inbox" hx-get="/inbox/table" hx-target="#inbox-table"
      hx-trigger="change" hx-push-url="true" style="max-width:22rem">
  <label>Домен
    <select name="domain_id">
      <option value="" {{ 'selected' if not picked }}>все</option>
      {% for d in domains %}
      <option value="{{ d.id }}" {{ 'selected' if picked == d.id|string }}>{{ d.name }}</option>
      {% endfor %}
    </select>
  </label>
</form>

<div id="inbox-table"
     hx-get="/inbox/table?domain_id={{ picked }}"
     hx-trigger="inbox-refresh from:body"
     hx-target="this">
  {% include "_inbox_table.html" %}
</div>

<dialog id="tagdlg">
  <article style="max-width:640px">
    <header>
      <button aria-label="Закрыть" rel="prev" onclick="closeTag()"></button>
      <strong>Разметка</strong>
    </header>
    <div id="tagcard"></div>
  </article>
</dialog>

<script>
  function openTag() { document.getElementById('tagdlg').showModal(); }
  function closeTag() { document.getElementById('tagdlg').close(); }
  document.body.addEventListener('htmx:afterSwap', function (e) {
    if (e.detail.target.id !== 'tagcard') return;
    if (e.detail.target.querySelector('[data-doc]')) openTag();
    if (e.detail.target.querySelector('[data-empty]')) { /* keep open, shows "пусто" */ }
  });
</script>
{% endblock %}
