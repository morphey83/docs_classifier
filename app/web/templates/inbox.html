{% extends "base.html" %}
{% block title %}Очередь на сортировку{% endblock %}
{% block page_title %}Очередь на сортировку{% endblock %}
{% block content %}
<p class="text-secondary">неразмеченные документы из всех ваших доменов</p>

<form method="get" action="/inbox" hx-get="/inbox/table" hx-target="#inbox-table"
      hx-trigger="change" hx-push-url="true" class="mb-3" style="max-width:22rem">
  <label class="form-label">Домен</label>
  <select class="form-select" name="domain_id">
    <option value="" {{ 'selected' if not picked }}>все</option>
    {% for d in domains %}
    <option value="{{ d.id }}" {{ 'selected' if picked == d.id|string }}>{{ d.name }}</option>
    {% endfor %}
  </select>
</form>

<div id="inbox-table"
     hx-get="/inbox/table?domain_id={{ picked }}"
     hx-trigger="inbox-refresh from:body"
     hx-target="this">
  {% include "_inbox_table.html" %}
</div>

<div class="modal modal-blur fade" id="tagdlg" tabindex="-1" aria-hidden="true"
     data-bs-backdrop="static">
  <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Разметка</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body" id="tagcard"></div>
    </div>
  </div>
</div>

<script>
  var _tagModal;
  function _tm() {
    if (!_tagModal) {
      _tagModal = window.tabler.Modal.getOrCreateInstance(document.getElementById('tagdlg'));
    }
    return _tagModal;
  }
  function openTag() { _tm().show(); }
  function closeTag() { _tm().hide(); }
  document.body.addEventListener('htmx:afterSwap', function (e) {
    if (e.detail.target.id !== 'tagcard') return;
    if (e.detail.target.querySelector('[data-doc], [data-empty]')) openTag();
  });
</script>
{% endblock %}
