{% extends "base.html" %}
{% import "_icons.html" as ic %}
{% block title %}Наборы{% endblock %}
{% block page_title %}Мои наборы{% endblock %}
{% block content %}

<form method="post" action="/sets" class="card mb-3">
  <div class="card-body row g-2 align-items-end">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <div class="col">
      <label class="form-label">Новый набор</label>
      <div class="input-icon">
        <span class="input-icon-addon">{{ ic.icon('clipboard') }}</span>
        <input class="form-control" name="name" placeholder="Название набора" required maxlength="200">
      </div>
    </div>
    <div class="col-auto"><button type="submit" class="btn btn-primary">Создать</button></div>
  </div>
</form>

<div class="mb-3">
  <div class="input-icon">
    <span class="input-icon-addon">{{ ic.icon('search') }}</span>
    <input class="form-control" name="q" value="{{ q }}" placeholder="фильтр по названию" autocomplete="off"
           hx-get="/sets" hx-target="#sets-table" hx-swap="outerHTML" hx-push-url="true"
           hx-trigger="input changed delay:300ms, search">
  </div>
</div>

{% include "_sets_table.html" %}
{% endblock %}
