{% extends "base.html" %}
{% set d = view.domain %}
{% block title %}{{ doc.title }} — DocsClassifier{% endblock %}
{% block content %}
<ol class="breadcrumb" aria-label="breadcrumbs">
  <li class="breadcrumb-item"><a href="/">Домены</a></li>
  <li class="breadcrumb-item"><a href="/domains/{{ d.slug }}">{{ d.name }}</a></li>
  <li class="breadcrumb-item"><a href="/search?domain_id={{ d.id }}">Поиск</a></li>
  <li class="breadcrumb-item active">{{ doc.title }}</li>
</ol>

<div id="doc">
  {% include "_doc_body.html" %}
</div>
{% endblock %}
