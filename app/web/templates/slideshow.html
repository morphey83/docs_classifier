<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ set.name }} — слайд-шоу</title>
  <style>
    html, body { margin:0; height:100%; background:#000; color:#ccc; overflow:hidden;
      font:14px system-ui,Segoe UI,Arial,sans-serif; }
    #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
    #stage img { max-width:100%; max-height:100%; object-fit:contain;
      opacity:0; transition:opacity .5s ease; }
    #stage img.on { opacity:1; }
    #hud { position:fixed; left:0; right:0; bottom:0; padding:.6rem 1rem;
      background:linear-gradient(transparent,rgba(0,0,0,.6)); display:flex; gap:1rem;
      align-items:center; opacity:0; transition:opacity .3s; }
    body:hover #hud, #hud:focus-within { opacity:1; }
    #hud button { font:inherit; color:#fff; background:#222; border:1px solid #444;
      border-radius:6px; padding:.35rem .7rem; cursor:pointer; }
    #cap { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #count { color:#888; }
    a.back { position:fixed; top:.6rem; left:.9rem; color:#888; text-decoration:none;
      opacity:0; transition:opacity .3s; }
    body:hover a.back { opacity:1; }
  </style>
</head>
<body>
  <a class="back" href="/g/{{ token }}">← в галерею</a>
  <div id="stage"><img id="a"><img id="b"></div>
  <div id="hud">
    <button id="prev" title="← назад">◀</button>
    <button id="playpause" title="пробел">⏸</button>
    <button id="next" title="→ / пробел вперёд">▶</button>
    <span id="cap"></span>
    <span id="count"></span>
  </div>

  <script>
    var IMAGES = [
      {% for d in images %}{ src: "/g/{{ token }}/i/{{ d.id }}", title: {{ d.title|tojson }} }{{ "," if not loop.last }}
      {% endfor %}
    ];
    var INTERVAL = {{ interval }} * 1000;
    var i = 0, playing = true, timer = null, slot = 0;
    var slots = [document.getElementById('a'), document.getElementById('b')];
    var cap = document.getElementById('cap'), count = document.getElementById('count');

    function show(n) {
      i = (n + IMAGES.length) % IMAGES.length;
      var next = slots[slot ^ 1], cur = slots[slot];
      next.onload = function () {
        next.classList.add('on'); cur.classList.remove('on'); slot ^= 1;
      };
      next.src = IMAGES[i].src;
      cap.textContent = IMAGES[i].title;
      count.textContent = (i + 1) + ' / ' + IMAGES.length;
      // preload the following one
      new Image().src = IMAGES[(i + 1) % IMAGES.length].src;
    }
    function step(d) { show(i + d); schedule(); }
    function schedule() {
      clearTimeout(timer);
      if (playing) timer = setTimeout(function () { step(1); }, INTERVAL);
    }
    function toggle() {
      playing = !playing;
      document.getElementById('playpause').textContent = playing ? '⏸' : '▶';
      schedule();
    }
    document.getElementById('next').onclick = function () { step(1); };
    document.getElementById('prev').onclick = function () { step(-1); };
    document.getElementById('playpause').onclick = toggle;
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
      else if (e.key === ' ') { e.preventDefault(); step(1); }
      else if (e.key.toLowerCase() === 'p') { toggle(); }
      else if (e.key === 'Escape') { location.href = '/g/{{ token }}'; }
    });
    show(0); schedule();
  </script>
</body>
</html>
