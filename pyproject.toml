[project]
name = "docsclassifier"
version = "0.0.0"
description = "Self-hosted document store with manual tagging and faceted search"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "RUF001", "RUF002", "RUF003"]
# inline HTML/JS page — its Cyrillic UI text and markup lines aren't Python style
"app/api/tglink.py" = ["E501", "RUF001"]
# the bot is Russian-facing: Cyrillic UI strings + long inline keyboard rows
"app/bot/**" = ["RUF001", "RUF002", "RUF003", "E501"]
# user-facing Russian: set-size limit messages + default names (§15)
"app/services/docsets.py" = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
